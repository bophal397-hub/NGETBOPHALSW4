<section>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Users</h2>
      <p class="text-muted mb-0">Manage customer and admin accounts.</p>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-success"></div>
  </div>

  <div *ngIf="!loading" class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.phone || '—' }}</td>
            <td><span class="badge text-bg-light text-capitalize">{{ user.role }}</span></td>
            <td>
              <span class="badge" [class.bg-success-subtle]="user.isActive" [class.bg-secondary-subtle]="!user.isActive" [class.text-success]="user.isActive" [class.text-secondary]="!user.isActive">
                {{ user.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td>{{ user.createdAt | date: 'mediumDate' }}</td>
            <td>
              <div class="btn-group btn-group-sm">
                <a class="btn btn-outline-secondary" [routerLink]="['/admin/users', user.id]">View</a>
                <button class="btn btn-outline-warning" type="button" (click)="toggleStatus(user)">{{ user.isActive ? 'Deactivate' : 'Activate' }}</button>
                <button class="btn btn-outline-danger" type="button" (click)="resetPassword(user.id)">Reset</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
