<section>
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div>
      <h2 class="fw-bold mb-1">Products</h2>
      <p class="text-muted mb-0">Manage store products and product inventory.</p>
    </div>
    <a class="btn btn-success" routerLink="/admin/products/add">Add Product</a>
  </div>

  <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label class="form-label">Search</label>
        <input class="form-control" type="text" [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event); currentPage.set(1)" placeholder="Search products" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Category</label>
        <select class="form-select" [ngModel]="selectedCategory()" (ngModelChange)="selectedCategory.set($event); currentPage.set(1)">
          <option value="">All</option>
          <option *ngFor="let category of categories()" [value]="category">{{ category }}</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Stock</label>
        <select class="form-select" [ngModel]="selectedStock()" (ngModelChange)="selectedStock.set($event); currentPage.set(1)">
          <option value="">All</option>
          <option value="in-stock">In Stock</option>
          <option value="low-stock">Low Stock</option>
          <option value="out-of-stock">Out of Stock</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Sort</label>
        <select class="form-select" [ngModel]="sortBy()" (ngModelChange)="sortBy.set($event); currentPage.set(1)">
          <option value="featured">Featured</option>
          <option value="price-asc">Price Low to High</option>
          <option value="price-desc">Price High to Low</option>
          <option value="rating">Highest Rating</option>
          <option value="az">A-Z</option>
        </select>
      </div>
    </div>
  </div>

  <div *ngIf="loading()" class="text-center py-5">
    <div class="spinner-border text-success"></div>
  </div>

  <div *ngIf="!loading()" class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Product</th>
            <th>Brand</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Rating</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of pagedProducts()">
            <td>
              <div class="d-flex align-items-center gap-3">
                <img [src]="product.thumbnail" [alt]="product.title" style="width: 60px; height: 60px; object-fit: cover; border-radius: 0.75rem;" />
                <div>
                  <div class="fw-semibold">{{ product.title }}</div>
                  <small class="text-muted">{{ product.id }}</small>
                </div>
              </div>
            </td>
            <td>{{ product.brand }}</td>
            <td>{{ product.category }}</td>
            <td>$ {{ product.price }}</td>
            <td>
              <span class="badge" [class.bg-success-subtle]="product.stock > 0" [class.bg-danger-subtle]="product.stock === 0" [class.text-success]="product.stock > 0" [class.text-danger]="product.stock === 0">{{ product.stock }}</span>
            </td>
            <td>{{ product.rating }}</td>
            <td>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" type="button" (click)="openEdit(product.id)">Edit</button>
                <button class="btn btn-outline-danger" type="button" (click)="deleteProduct(product)">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <nav class="mt-4" *ngIf="totalPages() > 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage() === 1">
        <button class="page-link" (click)="goToPage(currentPage() - 1)">Previous</button>
      </li>
      <li class="page-item" *ngFor="let page of [].constructor(totalPages()); let i = index" [class.active]="currentPage() === i + 1">
        <button class="page-link" (click)="goToPage(i + 1)">{{ i + 1 }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage() === totalPages()">
        <button class="page-link" (click)="goToPage(currentPage() + 1)">Next</button>
      </li>
    </ul>
  </nav>
</section>
