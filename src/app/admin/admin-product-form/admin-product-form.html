<section class="card border-0 shadow-sm rounded-4 p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1">{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h3>
      <p class="text-muted mb-0">{{ isEditMode ? 'Update product details.' : 'Create a new product listing.' }}</p>
    </div>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-success"></div>
  </div>

  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Title</label>
        <input class="form-control" formControlName="title" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Category</label>
        <select class="form-select" formControlName="category">
          <option value="" disabled>Select category</option>
          <option *ngFor="let category of categoryOptions()" [value]="category">{{ category }}</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Brand</label>
        <input class="form-control" formControlName="brand" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Price</label>
        <input class="form-control" type="number" formControlName="price" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Discount %</label>
        <input class="form-control" type="number" formControlName="discountPercentage" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Rating</label>
        <input class="form-control" type="number" formControlName="rating" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Stock</label>
        <input class="form-control" type="number" formControlName="stock" />
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="4" formControlName="description"></textarea>
      </div>
      <div class="col-12">
        <label class="form-label">Thumbnail URL</label>
        <input class="form-control" formControlName="thumbnail" />
      </div>
    </div>

    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-success" type="submit" [disabled]="submitting">
        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
        {{ submitting ? 'Saving...' : (isEditMode ? 'Save Changes' : 'Add Product') }}
      </button>
      <button class="btn btn-outline-secondary" type="button" routerLink="/admin/products">Cancel</button>
    </div>
  </form>
</section>
