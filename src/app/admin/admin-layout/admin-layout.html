<div class="d-flex min-vh-100 bg-light">
  <aside class="admin-sidebar bg-dark text-white" [class.open]="sidebarOpen">
    <div class="p-3 border-bottom border-secondary d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-bold fs-5">SETEC Admin</div>
        <small class="text-secondary">Management</small>
      </div>
      <button class="btn btn-link text-white d-lg-none" type="button" (click)="toggleSidebar()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <nav class="nav flex-column p-3 gap-2">
      <a class="nav-link text-white-50" routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
      </a>
      <a class="nav-link text-white-50" routerLink="/admin/products" routerLinkActive="active">
        <i class="bi bi-box-seam me-2"></i>Products
      </a>
      <a class="nav-link text-white-50" routerLink="/admin/users" routerLinkActive="active">
        <i class="bi bi-people me-2"></i>Users
      </a>
      <a class="nav-link text-white-50" routerLink="/admin/messages" routerLinkActive="active">
        <i class="bi bi-chat-left-text me-2"></i>Messages
      </a>
      <a class="nav-link text-white-50" routerLink="/admin/settings" routerLinkActive="active">
        <i class="bi bi-gear me-2"></i>Settings
      </a>
      <a class="nav-link text-white-50" routerLink="/" routerLinkActive="active">
        <i class="bi bi-shop me-2"></i>Back to Store
      </a>
      <button class="btn btn-outline-light btn-sm mt-3" type="button" (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
      </button>
    </nav>
  </aside>

  <div class="admin-content flex-grow-1">
    <header class="admin-topbar bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-lg-none" type="button" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <h5 class="mb-0 fw-bold">Admin Panel</h5>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted">{{ user()?.name }}</span>
      </div>
    </header>

    <main class="p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
