<section>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1">Messages</h2>
      <p class="text-muted mb-0">Customer support and inquiry center.</p>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-success"></div>
  </div>

  <div *ngIf="!loading" class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Sender</th>
            <th>Subject</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let message of messages">
            <td>
              <div class="fw-semibold">{{ message.name }}</div>
              <small class="text-muted">{{ message.email }}</small>
            </td>
            <td>{{ message.subject }}</td>
            <td>{{ message.createdAt | date: 'mediumDate' }}</td>
            <td>
              <span class="badge" [class.bg-warning]="message.status === 'unread'" [class.bg-secondary]="message.status === 'read'" [class.bg-success]="message.status === 'replied'">
                {{ message.status }}
              </span>
            </td>
            <td>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" type="button" (click)="markRead(message)">Mark Read</button>
                <button class="btn btn-outline-danger" type="button" (click)="deleteMessage(message.id)">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
