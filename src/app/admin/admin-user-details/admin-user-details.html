<section class="card border-0 shadow-sm rounded-4 p-4">
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-success"></div>
  </div>

  <div *ngIf="!loading && user">
    <h3 class="fw-bold mb-4">User Information</h3>
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card border-0 bg-light rounded-4 p-3 text-center">
          <img [src]="user.avatar || 'https://via.placeholder.com/100'" alt="User avatar" class="rounded-circle mx-auto mb-3" style="width: 100px; height: 100px; object-fit: cover;" />
          <h5 class="fw-bold">{{ user.name }}</h5>
          <span class="badge bg-success-subtle text-success text-capitalize">{{ user.role }}</span>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="text-muted small">Email</label>
            <div class="fw-semibold">{{ user.email }}</div>
          </div>
          <div class="col-md-6">
            <label class="text-muted small">Phone</label>
            <div class="fw-semibold">{{ user.phone || 'Not provided' }}</div>
          </div>
          <div class="col-md-6">
            <label class="text-muted small">Account Status</label>
            <div class="fw-semibold">{{ user.isActive ? 'Active' : 'Inactive' }}</div>
          </div>
          <div class="col-md-6">
            <label class="text-muted small">Created Date</label>
            <div class="fw-semibold">{{ user.createdAt | date: 'mediumDate' }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
