<article class="card h-100 border-0 shadow-sm product-card">
  <div class="position-relative overflow-hidden rounded-top">
    <img [src]="product.thumbnail" [alt]="product.title" class="card-img-top product-image" />
    <button class="btn btn-light btn-sm position-absolute top-0 end-0 m-3 rounded-circle" type="button" (click)="toggleWishList()">
      <i class="bi" [class.bi-heart-fill]="isWishlisted()" [class.bi-heart]="!isWishlisted()"></i>
    </button>
  </div>
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="badge bg-light text-success">{{ product.category }}</span>
      <span class="text-warning fw-semibold"><i class="bi bi-star-fill me-1"></i>{{ product.rating }}</span>
    </div>
    <h5 class="card-title fw-semibold">{{ product.title }}</h5>
    <p class="text-muted small mb-3">{{ product.brand }} • {{ product.description | slice:0:80 }}...</p>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <span class="fw-bold fs-5 text-success">${{ product.price }}</span>
        <div class="small text-muted">{{ product.discountPercentage }}% off</div>
      </div>
      <span class="badge" [class.bg-success]="product.stock > 0" [class.bg-danger]="product.stock === 0">{{ product.stock > 0 ? 'In Stock' : 'Out of Stock' }}</span>
    </div>
    <div class="mt-auto d-flex gap-2">
      <a class="btn btn-outline-success flex-grow-1" [routerLink]="['/product', product.id]">View Details</a>
      <button class="btn btn-success" type="button" (click)="addToCart()">Add to Cart</button>
    </div>
  </div>
</article>
