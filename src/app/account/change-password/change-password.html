<section class="container py-5 d-flex justify-content-center">
  <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 520px; width: 100%;">
    <div class="mb-4">
      <h3 class="fw-bold mb-1">Change Password</h3>
      <p class="text-muted mb-0">Keep your account secure with a stronger password.</p>
    </div>

    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input class="form-control form-control-lg" type="password" formControlName="currentPassword" [class.is-invalid]="submitted && form.controls['currentPassword'].invalid" />
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input class="form-control form-control-lg" type="password" formControlName="newPassword" [class.is-invalid]="submitted && form.controls['newPassword'].invalid" />
        <div class="form-text">Use at least 6 characters.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input class="form-control form-control-lg" type="password" formControlName="confirmPassword" [class.is-invalid]="submitted && form.controls['confirmPassword'].invalid || submitted && form.errors?.['passwordMismatch']" />
        <div class="invalid-feedback" *ngIf="submitted && form.errors?.['passwordMismatch']">New passwords must match.</div>
      </div>

      <button class="btn btn-success btn-lg w-100" type="submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Updating...' : 'Update Password' }}
      </button>
    </form>
  </div>
</section>
