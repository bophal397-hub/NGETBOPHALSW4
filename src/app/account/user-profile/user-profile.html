<section class="container py-5">
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <img
          [src]="user()?.avatar || 'https://via.placeholder.com/120'"
          alt="Profile avatar"
          class="rounded-circle mx-auto mb-3"
          style="width: 120px; height: 120px; object-fit: cover;"
        />
        <h4 class="fw-bold mb-1">{{ user()?.name }}</h4>
        <p class="text-muted mb-2">{{ user()?.email }}</p>
        <span class="badge bg-success-subtle text-success">{{ user()?.role }}</span>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <h3 class="fw-bold mb-3">Profile Information</h3>

        <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <form [formGroup]="profileForm" (ngSubmit)="submit()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input class="form-control form-control-lg" formControlName="name" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input class="form-control form-control-lg" formControlName="phone" />
            </div>
            <div class="col-12">
              <label class="form-label">Avatar URL</label>
              <input class="form-control form-control-lg" formControlName="avatar" />
            </div>
          </div>

          <button class="btn btn-success btn-lg mt-4" type="submit" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ loading ? 'Saving...' : 'Save Changes' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
