<section class="container py-5 d-flex justify-content-center">
  <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 480px; width: 100%;">
    <h2 class="fw-bold text-center mb-3">Reset Password</h2>
    <p class="text-muted text-center mb-4">Create a new password for your account.</p>

    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Reset Token</label>
        <input class="form-control" formControlName="token" [class.is-invalid]="submitted && resetForm.controls['token'].invalid" />
      </div>

      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input class="form-control" type="password" formControlName="password" [class.is-invalid]="submitted && resetForm.controls['password'].invalid" />
        <div class="invalid-feedback" *ngIf="submitted && resetForm.controls['password'].errors?.['required']">Password is required.</div>
        <div class="invalid-feedback" *ngIf="submitted && resetForm.controls['password'].errors?.['minlength']">Password must be at least 6 characters.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input class="form-control" type="password" formControlName="confirmPassword" [class.is-invalid]="submitted && resetForm.controls['confirmPassword'].invalid || submitted && resetForm.errors?.['passwordMismatch']" />
        <div class="invalid-feedback" *ngIf="submitted && resetForm.errors?.['passwordMismatch']">Passwords must match.</div>
      </div>

      <button class="btn btn-success w-100" type="submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>
  </div>
</section>
