<section class="container py-5">
  <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
    <div>
      <h1 class="fw-bold mb-2">Our Products</h1>
      <p class="text-muted mb-0">Explore a curated collection of popular products with filters and sorting options.</p>
    </div>
    <div class="d-flex gap-2 align-items-center w-100 w-lg-auto">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
        <input class="form-control border-0 bg-light" type="search" placeholder="Search title, brand, category" [(ngModel)]="searchTerm" (ngModelChange)="currentPage.set(1)" />
      </div>
    </div>
  </div>

  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="card border-0 shadow-sm rounded-4 p-3 sticky-top" style="top: 90px;">
        <h5 class="fw-bold mb-3">Filters</h5>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" [(ngModel)]="selectedCategory" (ngModelChange)="currentPage.set(1)">
            <option value="">All Categories</option>
            <option *ngFor="let category of categories()" [value]="category.slug">{{ category.name }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Brand</label>
          <select class="form-select" [(ngModel)]="selectedBrand" (ngModelChange)="currentPage.set(1)">
            <option value="">All Brands</option>
            <option *ngFor="let brand of brands()" [value]="brand">{{ brand }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Max Price</label>
          <select class="form-select" [(ngModel)]="selectedPrice" (ngModelChange)="currentPage.set(1)">
            <option value="">Any Price</option>
            <option value="100">Under $100</option>
            <option value="200">Under $200</option>
            <option value="500">Under $500</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Min Rating</label>
          <select class="form-select" [(ngModel)]="selectedRating" (ngModelChange)="currentPage.set(1)">
            <option value="">Any Rating</option>
            <option value="4">4+ Stars</option>
            <option value="4.5">4.5+ Stars</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Sort By</label>
          <select class="form-select" [(ngModel)]="sortBy" (ngModelChange)="currentPage.set(1)">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price Low to High</option>
            <option value="price-desc">Price High to Low</option>
            <option value="rating">Highest Rating</option>
            <option value="az">A-Z</option>
          </select>
        </div>
        <button class="btn btn-outline-success w-100" type="button" (click)="resetFilters()">Reset Filters</button>
      </div>
    </aside>

    <div class="col-lg-9">
      <div *ngIf="loading()" class="text-center py-5"><div class="spinner-border text-success"></div></div>
      <div *ngIf="!loading()">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <p class="text-muted mb-0">Showing {{ pagedProducts().length }} of {{ filteredProducts().length }} products</p>
          <span class="badge bg-success-subtle text-success">Page {{ currentPage() }} of {{ totalPages() }}</span>
        </div>
        <div class="row g-4">
          <div class="col-md-6 col-xl-4" *ngFor="let product of pagedProducts()">
            <app-product-card [product]="product"></app-product-card>
          </div>
        </div>

        <nav class="mt-5" *ngIf="totalPages() > 1">
          <ul class="pagination justify-content-center">
            <li class="page-item" [class.disabled]="currentPage() === 1">
              <button class="page-link" (click)="goToPage(currentPage() - 1)">Previous</button>
            </li>
            <li class="page-item" *ngFor="let page of [].constructor(totalPages()); let i = index" [class.active]="currentPage() === i + 1">
              <button class="page-link" (click)="goToPage(i + 1)">{{ i + 1 }}</button>
            </li>
            <li class="page-item" [class.disabled]="currentPage() === totalPages()">
              <button class="page-link" (click)="goToPage(currentPage() + 1)">Next</button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</section>
