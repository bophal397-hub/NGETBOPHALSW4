<section class="container py-5 d-flex justify-content-center">
  <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 480px; width: 100%;">
    <h2 class="fw-bold text-center mb-3">Forgot Password</h2>
    <p class="text-muted text-center mb-4">Enter your email to receive a password reset instruction.</p>

    <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <form [formGroup]="forgotForm" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" formControlName="email" [class.is-invalid]="submitted && forgotForm.controls['email'].invalid" />
        <div class="invalid-feedback" *ngIf="submitted && forgotForm.controls['email'].errors?.['required']">Email is required.</div>
        <div class="invalid-feedback" *ngIf="submitted && forgotForm.controls['email'].errors?.['email']">Enter a valid email.</div>
      </div>

      <button class="btn btn-success w-100" type="submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      <div class="text-center mt-3">
        <a routerLink="/login" class="text-success text-decoration-none">Back to login</a>
      </div>
    </form>
  </div>
</section>
