<section class="container py-5 d-flex justify-content-center">
  <div class="card border-0 shadow-sm rounded-4 p-4" style="max-width: 480px; width: 100%;">
    <h2 class="fw-bold text-center mb-3">Welcome Back</h2>
    <p class="text-muted text-center mb-4">Sign in to continue your shopping experience.</p>

    <div *ngIf="errorMessage" class="alert alert-danger text-center">{{ errorMessage }}</div>

    <div class="alert alert-light border mb-3">
      <div class="fw-semibold mb-1">Demo accounts</div>
      <div class="small text-muted">User: demo-user@example.com / 123456</div>
      <div class="small text-muted">Admin: demo-admin@example.com / 123456</div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" formControlName="email" [class.is-invalid]="submitted && loginForm.controls['email'].invalid" />
        <div class="invalid-feedback" *ngIf="submitted && loginForm.controls['email'].errors?.['required']">Email is required.</div>
        <div class="invalid-feedback" *ngIf="submitted && loginForm.controls['email'].errors?.['email']">Enter a valid email.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" formControlName="password" [class.is-invalid]="submitted && loginForm.controls['password'].invalid" />
        <div class="invalid-feedback" *ngIf="submitted && loginForm.controls['password'].errors?.['required']">Password is required.</div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" formControlName="rememberMe" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a routerLink="/forgot-password" class="text-success text-decoration-none">Forgot password?</a>
      </div>

      <button class="btn btn-success w-100" type="submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Signing in...' : 'Login' }}
      </button>

      <p class="text-center mt-3 mb-0">
        New customer? <a routerLink="/register" class="text-success">Create an account</a>
      </p>
    </form>
  </div>
</section>
