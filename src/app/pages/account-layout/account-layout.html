<section class="container py-5">
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="card border-0 shadow-sm rounded-4 p-3 account-panel">
        <div class="d-flex align-items-center gap-3 mb-3 px-2 pt-1">
          <img [src]="user()?.avatar || 'https://via.placeholder.com/60'" alt="User avatar" class="rounded-circle" style="width: 52px; height: 52px; object-fit: cover;" />
          <div>
            <div class="fw-semibold">{{ user()?.name }}</div>
            <small class="text-muted text-capitalize">{{ user()?.role }}</small>
          </div>
        </div>

        <nav class="nav flex-column gap-2">
          <a class="btn text-start nav-link-btn" routerLink="/account/profile" routerLinkActive="active">My Profile</a>
          <a class="btn text-start nav-link-btn" routerLink="/account/change-password" routerLinkActive="active">Change Password</a>
          <button class="btn btn-outline-danger text-start mt-2" type="button" (click)="logout()">Logout</button>
        </nav>
      </div>
    </div>

    <div class="col-lg-9">
      <router-outlet></router-outlet>
    </div>
  </div>
</section>
