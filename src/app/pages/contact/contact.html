<section class="container py-5">
  <div class="row g-5">
    <div class="col-lg-6">
      <h1 class="fw-bold mb-3">Contact Us</h1>
      <p class="text-muted">We would love to hear from you. Send us a message and our team will respond quickly.</p>
      <form [formGroup]="contactForm" (ngSubmit)="submit()" class="card border-0 shadow-sm rounded-4 p-4">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" formControlName="name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" formControlName="email" />
        </div>
        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input class="form-control" formControlName="subject" />
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" formControlName="message"></textarea>
        </div>
        <button class="btn btn-success" type="submit">Send Message</button>
      </form>
    </div>
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
        <h4 class="fw-bold mb-3">Visit Our Store</h4>
        <p class="text-muted"><i class="bi bi-geo-alt-fill text-success me-2"></i>Phnom Penh, Cambodia</p>
        <p class="text-muted"><i class="bi bi-telephone-fill text-success me-2"></i>+855 12 345 678</p>
        <p class="text-muted"><i class="bi bi-envelope-fill text-success me-2"></i>support@setecmarket.com</p>
        <div class="bg-light rounded-4 p-4 mt-4 text-center text-muted">
          <i class="bi bi-map fs-1"></i>
          <p class="mt-3 mb-0">Google Map Placeholder</p>
        </div>
      </div>
    </div>
  </div>
</section>
