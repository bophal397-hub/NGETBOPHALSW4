<div class="min-h-screen flex flex-col items-center justify-center bg-slate-100 p-6 space-y-6">
  <!-- Card Container -->
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
      Material Template
    </h1>
    
    <div class="example-container flex flex-col gap-4">
      <!-- Password Field -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Enter your password</mat-label>
        <input [(ngModel)]="password" matInput [type]="hide() ? 'password' : 'text'" />
        <button
          matIconButton
          matSuffix
          (click)="clickEvent($event)"
          [attr.aria-label]="hide() ? 'Show password' : 'Hide password'"
          [attr.aria-pressed]="!hide()"
        >
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <!-- Currency Field -->
      <mat-form-field appearance="outline" floatLabel="always" class="w-full">
        <mat-label>Amount</mat-label>
        <input matInput type="number" [(ngModel)]="amount" class="example-right-align" placeholder="0" />
        <span matTextPrefix>$&nbsp;</span>
        <span matTextSuffix>.00</span>
      </mat-form-field>
    </div>
  </div>
  <!-- Dialog Button -->
  <div class="example-button-row">
    <button matButton (click)="openDialog()">Open Dialog</button>
  </div>
</div>

<ng-template #dialogTemplate>
  <h2 mat-dialog-title>Dialog Title</h2>
  <mat-dialog-content>
    <p>This is a simple dialog content.</p>
    <p><strong>Password:</strong> {{password()}}</p>
    <p ><strong>Amount:</strong> {{amountTocurrency()}}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</ng-template>
