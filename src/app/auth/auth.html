<div class="container py-5">
  <div class="row g-4 justify-content-center align-items-stretch">
    <div class="col-lg-5">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body p-4 p-lg-5">
          <h2 class="h4 fw-bold mb-3">Login</h2>
          <p class="text-muted mb-4">Access your account with your email and password.</p>

          <form (ngSubmit)="onLoginSubmit()" #loginForm="ngForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" name="loginEmail" [(ngModel)]="login.email" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="loginPassword" [(ngModel)]="login.password" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <div class="alert alert-info mt-3 mb-0" *ngIf="loginMessage">
            {{ loginMessage }}
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body p-4 p-lg-5">
          <h2 class="h4 fw-bold mb-3">Register</h2>
          <p class="text-muted mb-4">Create a new account to get started.</p>

          <form (ngSubmit)="onRegisterSubmit()" #registerForm="ngForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input type="text" class="form-control" name="registerName" [(ngModel)]="register.name" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" name="registerEmail" [(ngModel)]="register.email" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" name="registerPassword" [(ngModel)]="register.password" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Confirm password</label>
              <input type="password" class="form-control" name="confirmPassword" [(ngModel)]="register.confirmPassword" required />
            </div>

            <button type="submit" class="btn btn-success w-100">Register</button>
          </form>

          <div class="alert alert-success mt-3 mb-0" *ngIf="registerMessage">
            {{ registerMessage }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
